<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tone</title>
  </head>
  <body>
    <button id="play">Play</button>
    <script>
      const params = new URLSearchParams(location.search);

      function createTone(context) {
        const source = context.createOscillator();
        source.frequency.value = Number(params.get("hz")) || 1000;
        return source;
      }

      // Pink noise, which stands in for music better than white noise. The low bins of white noise
      // carry little energy, so its spectrum reads far lower than a song's. The filter is Paul Kellet's
      // refined pink noise filter.
      function createPinkNoise(context) {
        const buffer = context.createBuffer(1, context.sampleRate * 2, context.sampleRate);
        const samples = buffer.getChannelData(0);
        const rows = [0, 0, 0, 0, 0, 0, 0];
        for (let index = 0; index < samples.length; index += 1) {
          const white = (Math.random() * 2) - 1;
          rows[0] = (0.99886 * rows[0]) + (white * 0.0555179);
          rows[1] = (0.99332 * rows[1]) + (white * 0.0750759);
          rows[2] = (0.969 * rows[2]) + (white * 0.153852);
          rows[3] = (0.8665 * rows[3]) + (white * 0.3104856);
          rows[4] = (0.55 * rows[4]) + (white * 0.5329522);
          rows[5] = (-0.7616 * rows[5]) - (white * 0.016898);
          samples[index] = (rows[0] + rows[1] + rows[2] + rows[3] + rows[4] + rows[5] + rows[6] + (white * 0.5362)) * 0.11;
          rows[6] = white * 0.115926;
        }
        const source = context.createBufferSource();
        source.buffer = buffer;
        source.loop = true;
        return source;
      }

      document.getElementById("play").addEventListener("click", () => {
        const context = new AudioContext();
        const level = context.createGain();
        const levelLinear = 0.1;
        level.gain.value = levelLinear;
        const source = params.has("noise") ? createPinkNoise(context) : createTone(context);
        source.connect(level).connect(context.destination);
        source.start();
        document.title = `playing ${context.state}`;
      });
    </script>
  </body>
</html>
