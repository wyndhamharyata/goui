<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>goui</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <span class="brand">goui</span>
        <div class="head-right">
          <button id="viewToggle" class="view" title="Rotate the graph between horizontal and vertical">↔</button>
          <label class="switch">
            <input type="checkbox" id="enabled" />
            <span class="track"></span>
            <span class="label">EQ</span>
          </label>
        </div>
      </header>

      <div class="stage">
        <canvas id="curve"></canvas>
        <div class="readout"><span id="level">--</span><span class="unit">dB</span></div>
      </div>

      <div class="capture">
        <button id="capture">Start capture</button>
        <span id="status">No audio</span>
      </div>

      <div class="preamp">
        <span class="caption">Preamp</span>
        <input type="range" id="preamp" min="-24" max="12" step="0.1" value="0" />
        <span id="preampValue">0.0</span>
        <span class="unit">dB</span>
      </div>

      <div class="bands" id="bands"></div>

      <div class="actions">
        <button id="addBand">Add band</button>
        <button id="bypass" class="quiet" title="Hold to hear the audio without the EQ">Bypass</button>
        <button id="importToggle" class="quiet">AutoEQ</button>
        <button id="presetToggle" class="quiet">Presets</button>
      </div>

      <section class="panel" id="importPanel" hidden>
        <textarea id="autoEqText" spellcheck="false" placeholder="Preamp: -6.2 dB&#10;Filter 1: ON PK Fc 105 Hz Gain -3.1 dB Q 0.70"></textarea>
        <div class="row">
          <input type="file" id="autoEqFile" accept=".txt,text/plain" />
          <button id="applyAutoEq">Apply</button>
        </div>
        <div class="hint" id="importHint"></div>
      </section>

      <section class="panel" id="presetPanel" hidden>
        <div class="row">
          <input type="text" id="presetName" placeholder="Preset name" />
          <button id="presetSave">Save</button>
        </div>
        <div class="preset-list" id="presetList"></div>
        <textarea id="presetJson" spellcheck="false" placeholder="Preset JSON"></textarea>
        <div class="row">
          <button id="presetExport" class="quiet">Current to JSON</button>
          <button id="presetImport" class="quiet">JSON to current</button>
        </div>
        <div class="hint" id="presetHint"></div>
      </section>
    </div>

    <script type="module" src="panel.js"></script>
  </body>
</html>
