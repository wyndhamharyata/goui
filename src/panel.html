<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>goui</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="app" id="app" data-showing="listen">
      <header class="head">
        <div class="row">
          <span class="brand">goui</span>
          <button id="compare" class="hold" title="Hold to hear the sound without the EQ">A/B</button>
          <label class="switch" title="Turn the EQ on or off">
            <input type="checkbox" id="enabled" />
            <span class="track"></span>
          </label>
        </div>
        <div class="row">
          <button id="capture" class="small">Start</button>
          <span id="status" class="source">No audio</span>
          <span class="meter" id="meter"><i id="clip" class="dot"></i><span id="level">--</span> dB</span>
        </div>
      </header>

      <nav class="tabs" id="tabs">
        <button data-tab="listen">Listen</button>
        <button data-tab="tune">Tune</button>
        <button data-tab="library">Library</button>
      </nav>

      <div class="panes">
        <section class="pane" data-pane="listen">
          <h4 class="column-title">Listen</h4>
          <button class="card sound" id="soundCard" title="Open the Library to pick another sound">
            <span class="grow">
              <small class="caption" id="profileKind">Starter sound</small>
              <b id="profileName" class="profile">Flat</b>
            </span>
            <span class="change">Change</span>
          </button>
          <div class="card"><div class="graph" id="listenGraph"></div></div>
          <div class="card" id="macros">
            <label class="macro">
              <span>Bass<small>Below 120 Hz</small></span>
              <input type="range" id="bass" min="-6" max="6" step="0.5" value="0" />
              <output id="bassValue">0.0 dB</output>
            </label>
            <label class="macro">
              <span>Vocals<small>Around 2.5 kHz</small></span>
              <input type="range" id="vocals" min="-6" max="6" step="0.5" value="0" />
              <output id="vocalsValue">0.0 dB</output>
            </label>
            <label class="macro">
              <span>Treble<small>Above 8 kHz</small></span>
              <input type="range" id="treble" min="-6" max="6" step="0.5" value="0" />
              <output id="trebleValue">0.0 dB</output>
            </label>
            <div class="macro preamp">
              <span>Preamp<small id="preampNote">Auto</small></span>
              <input type="range" id="preamp" min="-24" max="12" step="0.1" value="0" />
              <output id="preampValue">0.0 dB</output>
              <button id="autoPreamp" class="small" title="Set the preamp from the largest boost, so the sound never clips">Auto</button>
            </div>
          </div>
        </section>

        <section class="pane" data-pane="tune">
          <h4 class="column-title">Tune</h4>
          <div class="pills" id="zoom">
            <button data-zoom="all">All</button>
            <button data-zoom="lows">Lows</button>
            <button data-zoom="mids">Mids</button>
            <button data-zoom="highs">Highs</button>
            <button id="tall" title="Turn the graph so frequency runs down the panel">Tall</button>
          </div>
          <div class="card">
            <div class="graph" id="tuneGraph"></div>
            <div class="legend">
              <span><i class="swatch" style="height: 2px; background: #5b8cff"></i>EQ curve</span>
              <span><i class="swatch" style="background: rgba(91, 140, 255, 0.3)"></i>Live sound</span>
              <span><i class="swatch" style="background: rgba(255, 122, 144, 0.5)"></i>Louder</span>
              <span><i class="swatch" style="background: rgba(79, 163, 255, 0.5)"></i>Quieter</span>
              <span><i class="swatch" style="background: rgba(176, 107, 255, 0.35)"></i>Selected band</span>
              <span><i class="swatch" style="height: 0; border-top: 2px dashed #b06bff"></i>Band width (Q)</span>
              <span><i class="swatch round" style="background: #b06bff"></i>Peak</span>
              <span><i class="swatch round" style="background: #2ec4b6"></i>Shelf</span>
              <span><i class="swatch round" style="background: #ff9f43"></i>Cut and notch</span>
            </div>
          </div>
          <div class="chips" id="chips"></div>
          <div class="card" id="inspector">
            <p class="hint" id="inspectorEmpty">Tap a point or a chip to tune that band. Double click the graph to make a new band.</p>
            <div id="inspectorBody" hidden>
              <div class="row">
                <b id="bandTitle" class="grow"></b>
                <button id="bandOn" class="small">On</button>
                <button id="bandSolo" class="small" title="Hear this band alone">Solo</button>
                <button id="bandDelete" class="small" title="Delete this band">Delete</button>
              </div>
              <div class="segments" id="bandSegments">
                <button data-type="PK">Peak</button>
                <button data-type="LSC">Low shelf</button>
                <button data-type="HSC">High shelf</button>
                <button data-type="HP">Low cut</button>
                <button data-type="LP">High cut</button>
                <button id="moreTypes" class="more" title="More band types">More</button>
              </div>
              <select id="bandType" hidden></select>
              <div class="stepper">
                <button data-step="frequency" data-direction="-1" title="One semitone lower">-</button>
                <label><input type="text" inputmode="decimal" id="frequencyInput" /><small>frequency, Hz</small></label>
                <button data-step="frequency" data-direction="1" title="One semitone higher">+</button>
              </div>
              <div class="stepper">
                <button data-step="gain" data-direction="-1" title="0.5 dB lower">-</button>
                <label><input type="text" inputmode="decimal" id="gainInput" /><small>gain, dB</small></label>
                <button data-step="gain" data-direction="1" title="0.5 dB higher">+</button>
              </div>
              <div class="stepper">
                <button data-step="q" data-direction="-1" title="Wider band">-</button>
                <label><input type="text" inputmode="decimal" id="qInput" /><small id="qHint">Q</small></label>
                <button data-step="q" data-direction="1" title="Narrower band">+</button>
              </div>
            </div>
          </div>
          <details class="card">
            <summary>Number table</summary>
            <table class="band-table" id="table"></table>
          </details>
        </section>

        <section class="pane" data-pane="library">
          <h4 class="column-title">Library</h4>
          <div class="card">
            <input type="search" id="librarySearch" placeholder="Search your headphones, for example HD 600" />
            <div class="results" id="libraryResults"></div>
            <p class="hint" id="librarySearchHint"></p>
            <div class="library-actions" id="libraryActions">
              <button data-action="save" title="Keep the sound you hear under a name">Save</button>
              <button data-action="import" title="Load a ParametricEQ.txt or a JSON file">Import</button>
              <button data-action="paste" title="Paste AutoEQ text or JSON">Paste</button>
              <button data-action="export" title="Copy the sound you hear as AutoEQ text or JSON">Export</button>
            </div>
            <div class="row" id="saveRow" hidden>
              <input type="text" id="saveName" placeholder="Name for the sound you hear" />
              <button id="saveButton" class="on">Save</button>
            </div>
            <div class="drawer" id="textDrawer" hidden>
              <textarea id="libraryText" spellcheck="false" placeholder="Paste AutoEQ text or JSON here"></textarea>
              <div class="row" id="pasteActions">
                <button id="applyText" class="on grow">Apply</button>
              </div>
              <div class="row" id="exportActions">
                <button id="exportAutoEq" class="grow">AutoEQ text</button>
                <button id="exportJson" class="grow">JSON</button>
              </div>
            </div>
            <input type="file" id="importFile" accept=".txt,.json,text/plain,application/json" hidden />
            <p class="hint" id="libraryHint"></p>
          </div>
        </section>
      </div>
    </div>

    <script type="module" src="panel.js"></script>
  </body>
</html>
