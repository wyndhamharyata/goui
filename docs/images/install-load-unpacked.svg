<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img"><defs><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a7ae0"/><stop offset="1" stop-color="#8f52d8"/></linearGradient></defs><rect width="720" height="300" fill="#0e1013"/><text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f2f3f5" text-anchor="start">Step 2. Load the folder in Chrome</text><text x="32" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#a2a9b6" text-anchor="start">Type chrome://extensions in the address bar, or brave://extensions in Brave.</text><text x="32" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#a2a9b6" text-anchor="start">Turn on Developer mode at the top right. The Load unpacked button then appears.</text><rect x="32" y="108" width="656" height="158" rx="10" fill="#1d2128"/><text x="46" y="132" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#a2a9b6" text-anchor="start">chrome://extensions</text><text x="46" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f2f3f5" text-anchor="start">Extensions</text><text x="46" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#a2a9b6" text-anchor="start">Keyboard shortcuts</text><rect x="44" y="194" width="632" height="30" rx="8" fill="#15181d" stroke="#22262e" stroke-width="1"/><text x="56" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#f2f3f5" text-anchor="start">Developer mode</text><rect x="632" y="202" width="32" height="18" rx="9" fill="#3ddc97"/><circle cx="656" cy="211" r="6" fill="#ffffff"/><rect x="44" y="232" width="632" height="24" rx="6" fill="#d4ff3f"/><text x="360" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0b0c0e" text-anchor="middle">Load unpacked</text><g transform="translate(102 254)"><path d="M0 0 l13 10.5 -6 0.7 3.2 6.8 -2.9 1.3 -3.1-6.9 -4.2 4z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/></g></svg>